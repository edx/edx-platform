name: Check Python Dependencies

on:
  pull_request:

jobs:
  check_dependencies:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install compatible packaging tools
        run: python -m pip install --upgrade "pip<24" "setuptools<70"

      - name: Install repo-tools
        run: python -m pip install edx-repo-tools[find_dependencies]

      - name: Ensure setuptools is available
        run: python -m pip install --force-reinstall "setuptools<70"

      - name: Run Python script
        run: |
          find_python_dependencies \
            --req-file requirements/edx/base.txt \
            --req-file requirements/edx/testing.txt \
            --ignore https://github.com/edx/edx-name-affirmation \
            --ignore https://github.com/mitodl/edx-sga \
            --ignore https://github.com/open-craft/xblock-poll
