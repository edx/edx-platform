name: Check Python Dependencies

on:
  pull_request:

jobs:
  check_dependencies:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Debug Python Environment
        run: |
          python --version
          pip --version
          pip list

      - name: Clear pip cache
        run: pip cache purge

      - name: Force reinstall setuptools
        run: pip install --force-reinstall --upgrade setuptools

      - name: Ensure setuptools and wheel are installed
        run: pip install --upgrade setuptools wheel

      - name: Install repo-tools
        run: pip install edx-repo-tools[find_dependencies]

      - name: Run Python script
        run: |
          find_python_dependencies \
            --req-file requirements/edx/base.txt \
            --req-file requirements/edx/testing.txt \
            --ignore https://github.com/edx/edx-name-affirmation \
            --ignore https://github.com/mitodl/edx-sga \
            --ignore https://github.com/open-craft/xblock-poll